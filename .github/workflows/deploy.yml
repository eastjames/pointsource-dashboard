# Builds the Vite app and publishes it to GitHub Pages on every push to
# main. Uses the modern Actions-based Pages deployment (not the older
# approach of committing a build to a gh-pages branch) - enable it once in
# this repo's Settings -> Pages -> Source -> "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you manually re-run a deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time; a new push cancels an in-progress one
# rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
